<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <h1>E-Commerce Store</h1>
            </div>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/register" class="btn-register">Register</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="registration-container">
            <div class="registration-box">
                <h2>Create Your Account</h2>
                
                <div th:if="${successMessage}" class="alert alert-success">
                    <span th:text="${successMessage}">Success message</span>
                </div>

                <div th:if="${errorMessage}" class="alert alert-error">
                    <span th:text="${errorMessage}">Error message</span>
                </div>

                <form th:action="@{/register}" th:object="${customer}" method="post" class="registration-form">
                    <div class="form-group">
                        <label for="name">Full Name:</label>
                        <input 
                            type="text" 
                            id="name" 
                            name="name" 
                            th:field="*{name}"
                            placeholder="Enter your full name"
                            required
                        />
                        <span class="error-message" th:if="${#fields.hasErrors('name')}" th:errors="*{name}">Name error</span>
                    </div>

                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            th:field="*{password}"
                            placeholder="Enter your password"
                            minlength="6"
                            required
                        />
                        <span class="error-message" th:if="${#fields.hasErrors('password')}" th:errors="*{password}">Password error</span>
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-submit">Register</button>
                        <a href="/" class="btn-cancel">Cancel</a>
                    </div>
                </form>

                <p class="login-link">
                    Already have an account? <a href="/">Go back to home</a>
                </p>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 E-Commerce Store. All rights reserved.</p>
    </footer>
</body>
</html>
