<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User Login</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <nav class="navbar">
        <div class="container">
            <div class="navbar-brand">
                <h1>E-Commerce Store</h1>
            </div>
            <ul class="nav-links">
                <li><a href="/">Home</a></li>
                <li><a href="/register" class="btn-register">Register</a></li>
                <li><a href="/login" class="btn-register">Login</a></li>
            </ul>
        </div>
    </nav>

    <div class="container">
        <div class="registration-container">
            <div class="registration-box">
                <h2>Login to Your Account</h2>
                
                <div th:if="${successMessage}" class="alert alert-success">
                    <span th:text="${successMessage}">Success message</span>
                </div>

                <div th:if="${errorMessage}" class="alert alert-error">
                    <span th:text="${errorMessage}">Error message</span>
                </div>

                <form th:action="@{/login}" method="post" class="registration-form">
                    <div class="form-group">
                        <label for="userType">Account Type:</label>
                        <select id="userType" name="userType" required>
                            <option value="">-- Select Account Type --</option>
                            <option value="customer">Customer</option>
                            <option value="seller">Seller</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="name">Username:</label>
                        <input 
                            type="text" 
                            id="name" 
                            name="name" 
                            placeholder="Enter your username"
                            required
                        />
                    </div>

                    <div class="form-group">
                        <label for="password">Password:</label>
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            placeholder="Enter your password"
                            required
                        />
                    </div>

                    <div class="form-actions">
                        <button type="submit" class="btn-submit">Login</button>
                        <a href="/" class="btn-cancel">Cancel</a>
                    </div>
                </form>

                <p class="login-link">
                    Don't have an account? <a href="/register">Register here</a>
                </p>
            </div>
        </div>
    </div>

    <footer class="footer">
        <p>&copy; 2026 E-Commerce Store. All rights reserved.</p>
    </footer>
</body>
</html>
